services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: health
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
    ports:
      - "55432:5432"
    volumes:
      - health_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  health_postgres:
